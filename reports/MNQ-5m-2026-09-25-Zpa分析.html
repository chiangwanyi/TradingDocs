<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MNQ 5m · Z说交易体系盘面分析（2026-09-25）</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f5f4f1; --panel:#fff; --panel2:#f1efe9; --panel3:#eceae3;
  --line:#e4e1d9; --line2:#cfcbc0;
  --ink:#232219; --ink2:#3d3b33; --muted:#6f6c63; --faint:#97948b;
  --accent:#185fa5; --accentbg:#e6f1fb; --accentbd:#b5d4f4;
  --ok:#0f6e56; --okbg:#e1f5ee; --okbd:#9fe1cb;
  --warn:#854f0b; --warnbg:#faeeda; --warnbd:#f5d9a8;
  --bad:#a32d2d; --badbg:#fcebeb; --badbd:#f0c4c4;
  --up:#c0362f; --dn:#0f6e56;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1600px;margin:0 auto;padding:24px 28px 56px}
h1,h2,h3{font-weight:500;margin:0}
h1{font-size:21px;letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:12px;background:var(--panel3);padding:1px 4px;border-radius:4px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.top .sub{color:var(--muted);font-size:13px;margin-top:5px}
.verdict{text-align:right;flex:none}
.verdict .pill{display:inline-flex;align-items:center;gap:8px;background:var(--warnbg);color:var(--warn);
  border:1px solid var(--warnbd);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.verdict .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.verdict .px{font-family:var(--mono);font-size:24px;margin-top:8px;letter-spacing:-.02em}
.verdict .px small{font-size:12px;color:var(--muted);font-family:inherit;margin-left:7px}

/* ---------- metric cards ---------- */
.metrics{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin:16px 0}
.m{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.m .k{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .v{font-family:var(--mono);font-size:15.5px;margin-top:3px;letter-spacing:-.01em}
.m .x{font-size:11px;color:var(--faint);margin-top:1px}
.v.up{color:var(--up)} .v.dn{color:var(--dn)}

/* ---------- 双栏：图表左 / 分析右 ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:18px;align-items:start}
.paneL{position:sticky;top:14px;display:flex;flex-direction:column;gap:11px}
.paneR{display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---------- controls ---------- */
.bar{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bar .grp{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bar .glab{font-size:11.5px;color:var(--faint);margin-right:2px}
.chip{border:1px solid var(--line2);background:var(--panel);color:var(--ink2);border-radius:999px;
  padding:3px 11px;font-size:12.5px;cursor:pointer;line-height:1.5;transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--accentbd);background:var(--accentbg);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent);width:14px;height:14px;margin:0;cursor:pointer}
.tog.off{color:var(--faint)}

/* ---------- chart ---------- */
.chartcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px 0;position:relative}
.chartcard svg{display:block;width:100%;height:auto}
#tip{position:absolute;pointer-events:none;background:rgba(35,34,25,.94);color:#fff;border-radius:8px;
  padding:8px 11px;font-size:12px;line-height:1.55;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:9}
#tip .r{font-family:var(--mono)}
#tip .hd{font-weight:500;margin-bottom:3px}
#tip .up{color:#ff9b95} #tip .dn{color:#8ee0be}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px 14px 11px;font-size:11px;color:var(--muted);
  border-top:1px solid var(--line);margin-top:2px}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.li-line{width:16px;height:0;border-top:1.4px solid var(--accent)}
.li-cnd{width:8px;height:11px;background:var(--up);border-radius:1px}
.li-cnd2{width:8px;height:11px;background:var(--dn);border-radius:1px}
.li-dash-res{width:16px;height:0;border-top:1.6px dashed var(--bad)}
.li-dash-sup{width:16px;height:0;border-top:1.6px dashed var(--ok)}
.li-dash-mm{width:16px;height:0;border-top:1.6px dotted var(--warn)}
.li-band{width:16px;height:9px;background:var(--panel3);border:1px solid var(--line2)}
.li-gap{width:16px;height:9px;background:#fbe6c8;border:1px solid var(--warnbd)}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:12px 15px;border-bottom:1px solid var(--line)}
.panel>.ph .hint{font-size:11.5px;color:var(--faint);text-align:right}
.panel>.pb{padding:6px 15px 13px}

/* steps */
.step{padding:11px 11px;border-radius:9px;cursor:pointer;transition:.12s;border:1px solid transparent}
.step+.step{border-top:1px solid var(--line);border-radius:0}
.step:hover{background:var(--panel2)}
.step.on{background:var(--accentbg);border-color:var(--accentbd)}
.step a{cursor:pointer}
.step .sh{display:flex;align-items:center;gap:8px}
.step .idx{width:20px;height:20px;flex:none;border-radius:50%;background:var(--panel3);color:var(--muted);
  font-size:11px;font-family:var(--mono);display:flex;align-items:center;justify-content:center}
.step.on .idx{background:var(--accent);color:#fff}
.step .ttl{font-size:13px;font-weight:500;flex:1;min-width:0}
.tag{font-size:11.5px;border-radius:999px;padding:2px 9px;white-space:nowrap;font-weight:500}
.tag.range{background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.warn{background:var(--panel3);color:var(--muted)}
.step ul{margin:7px 0 0;padding-left:19px}
.step li{font-size:12.5px;color:var(--ink2);line-height:1.62;margin-bottom:3px}
.step li b{font-weight:500;color:var(--ink);background:#fff2cf;padding:0 3px;border-radius:3px}
.step .go{font-size:11px;color:var(--faint);flex:none}

/* level table */
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--faint);font-weight:400;text-align:left;padding:0 8px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tr.lv{cursor:pointer;transition:.1s}
tr.lv:hover{background:var(--panel2)}
tr.lv.on{background:var(--accentbg)}
td.p{font-family:var(--mono);font-size:13px;white-space:nowrap}
td.p.res{color:var(--bad)} td.p.sup{color:var(--ok)}
td.nm{color:var(--ink2)}
.mask{display:inline-flex;gap:2px;vertical-align:middle}
.mask i{width:8px;height:8px;border-radius:2px;background:var(--line2)}
.mask i.on{background:var(--accent)}
.rl{font-size:11.5px;color:var(--muted);line-height:1.5}
.rl b{color:var(--ink);font-weight:400}

/* scenarios */
.scen{display:grid;grid-template-columns:1fr;gap:12px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;cursor:pointer;transition:.13s}
.sc:hover{border-color:var(--line2)}
.sc.on{border-color:var(--accentbd);box-shadow:0 0 0 2px var(--accentbg) inset}
.sc .hd{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.sc .badge{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:500;font-family:var(--mono)}
.sc.s-short .badge{background:var(--badbg);color:var(--bad)}
.sc.s-long .badge{background:var(--okbg);color:var(--ok)}
.sc .nm2{font-size:13.5px;font-weight:500}
.sc .dirtag{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;margin-left:auto}
.sc .when{font-size:12px;color:var(--muted);line-height:1.55}
.sc .rows{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.sc .row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:2px 0}
.sc .row span:first-child{color:var(--faint);flex:none}
.sc .row .v{font-family:var(--mono);text-align:right}
.sc .row.e .v{color:var(--accent)} .sc .row.s .v{color:var(--bad)} .sc .row.t .v{color:var(--ok)}
.sc .note{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.55;
  background:var(--panel2);border-radius:7px;padding:7px 9px}

/* gaps */
.gbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.glist{max-height:250px;overflow:auto}
td.mono{font-family:var(--mono)}
.badge2{font-size:11px;padding:1px 7px;border-radius:4px;white-space:nowrap}
.badge2.open{background:var(--warnbg);color:var(--warn)}
.badge2.done{background:var(--panel3);color:var(--muted)}
.badge2.noise{background:var(--panel3);color:var(--faint)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px}
.sum .s{background:var(--panel2);border-radius:9px;padding:9px 11px}
.sum .s .k{font-size:11px;color:var(--faint)}
.sum .s .v{font-family:var(--mono);font-size:17px;margin-top:2px}

/* facts */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 15px 4px}
.fg{background:var(--panel2);border-radius:9px;padding:8px 10px}
.fg .k{font-size:11px;color:var(--faint)}
.fg .v{font-family:var(--mono);font-size:13px;margin-top:2px}
.fg .x{font-size:11px;color:var(--muted);margin-top:1px;font-family:inherit}
.nlist{padding:6px 15px 4px}
.nlist div{font-size:11.5px;color:var(--warn);line-height:1.6;padding-left:11px;position:relative;margin-bottom:2px}
.nlist div::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
details.cand{margin:8px 15px 12px;border-top:1px dashed var(--line2);padding-top:9px}
details.cand summary{font-size:11.5px;color:var(--accent);cursor:pointer;outline:none}
details.cand table{margin-top:7px}
details.cand td{font-size:11.5px;padding:5px 7px}
details.cand .cd{font-size:11px;color:var(--faint);line-height:1.5}

.foot{margin-top:24px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.7}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:24px 0 10px}
.sechead .hint{font-size:12px;color:var(--faint)}
.empty{padding:16px 15px;font-size:12.5px;color:var(--faint)}
.ev{padding:9px 0}
.ev+.ev{border-top:1px solid var(--line)}
.ev .eh{display:flex;align-items:center;gap:9px;margin-bottom:2px;flex-wrap:wrap}
.ev .ek{font-size:12.5px;font-weight:500}
.ev .et{font-size:12px;color:var(--muted);line-height:1.58}
@media (max-width:1280px){.split{grid-template-columns:1fr}.paneL{position:static}}
@media (max-height:700px){.paneL{position:static}}
</style>
</head>

  </section>

  <div class="foot" id="foot"></div>
</div>

    const ph = DATA.phases.find(p => i >= p.from_idx && i <= p.to_idx);
    return !ph || ph.id === S.phase;
  };
  const one = i => {
    const b = DATA.bars[i];
    const col = b.c >= b.o ? 'var(--up)' : 'var(--dn)';
    const cx = X(i), w = Math.max(2.4, step - 1.7);
    const yc = Y(b.c), top = Math.min(Y(b.o), yc), hgt = Math.max(1.1, Math.abs(yc - Y(b.o)));
    return `<line x1="${cx.toFixed(1)}" y1="${Y(b.h).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${Y(b.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`
         + `<rect x="${(cx - w / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${col}"/>`;
  };
  let out = '', i = 0;
  while (i < N) {
    const a = activeOf(i);
    let j = i;
    while (j + 1 < N && activeOf(j + 1) === a) j++;
    out += `<g opacity="${a ? 1 : 0.18}">`;
    for (let k = i; k <= j; k++) out += one(k);
    out += `</g>`;
    i = j + 1;
  }
  return out;
}

function phaseBands() {
  let out = '';
  for (const ph of DATA.phases) {
    const active = S.phase === 'all' || S.phase === ph.id;
    const sel = S.phase === ph.id;
    const px = X(ph.from_idx) - step / 2, pw = X(ph.to_idx) - px + step / 2;
    if (S.layers.phase) {
      out += `<rect x="${px.toFixed(1)}" y="${y0}" width="${pw.toFixed(1)}" height="${y1 - y0}"
        fill="${sel ? 'var(--accentbg)' : 'var(--panel2)'}" opacity="${active ? (sel ? 0.95 : 0.85) : 0.3}"/>`;
      out += `<rect x="${px.toFixed(1)}" y="${y0 + 4}" width="${pw.toFixed(1)}" height="17" rx="4"
        fill="${sel ? 'var(--accent)' : 'var(--line2)'}" opacity="${active ? 0.9 : 0.3}"/>`;
      out += `<text x="${(px + 7).toFixed(1)}" y="${y0 + 17}" font-size="10.5" font-weight="500"
        fill="${sel ? '#fff' : 'var(--ink2)'}" opacity="${active ? 1 : 0.45}">${esc(ph.label)}</text>`;
      if (pw > 130 && ph.note) {
        out += `<text x="${(px + 7).toFixed(1)}" y="${y0 + 35}" font-size="10" fill="var(--muted)"
          opacity="${active ? 0.9 : 0.35}">${esc(ph.note)}</text>`;
      }
    } else {
      out += `<text x="${(px + 7).toFixed(1)}" y="${y0 + 13}" font-size="10.5" fill="var(--faint)"
        opacity="${active ? 1 : 0.4}">${esc(ph.label)}</text>`;
    }
    if (S.phase !== 'all' && !active) {
      out += `<rect x="${px.toFixed(1)}" y="${y0}" width="${pw.toFixed(1)}" height="${y1 - y0}" fill="var(--bg)" opacity="0.55"/>`;
    }
  }
  return out;
}

function gridSvg() {
  let out = '';
  const lvY = DATA.levels.map(l => Y(l.price));
  const lo = Math.ceil(PMIN / 50) * 50, hi = Math.floor(PMAX / 50) * 50;
  for (let p = lo; p <= hi; p += 50) {
    const y = Y(p);
    out += `<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="0.6"/>`;
    // 关键位标签占用了右侧边距，刻度只在不会重叠时才画
    if (lvY.every(ly => Math.abs(ly - y) > 11)) {
      out += `<text x="${x1 + 8}" y="${y.toFixed(1)}" font-size="10.5" font-family="var(--mono)" fill="var(--faint)" dominant-baseline="middle">${p}</text>`;
    }
  }
  const marks = [];
  for (let i = 0; i < N; i += 45) marks.push(i);
  if (marks[marks.length - 1] !== N - 1) marks.push(N - 1);
  for (const i of marks) {
    out += `<line x1="${X(i).toFixed(1)}" y1="${y1}" x2="${X(i).toFixed(1)}" y2="${y1 + 5}" stroke="var(--line2)" stroke-width="0.8"/>`
         + `<text x="${X(i).toFixed(1)}" y="${y1 + 17}" font-size="10.5" font-family="var(--mono)" fill="var(--faint)" text-anchor="middle">${DATA.bars[i].t}</text>`;
  }
  out += `<text x="${x1}" y="${y1 + 32}" font-size="10.5" fill="var(--faint)" text-anchor="end">时间（CST，${DATA.meta.interval}/根，共 ${N} 根）</text>`;
  return out;
}

function emaSvg() {
  if (!S.layers.ema || DATA.ema.every(v => v == null)) return '';
  let d = '', started = false, last = null;
  for (let i = 0; i < N; i++) {
    const v = DATA.ema[i];
    if (v == null) continue;
    d += (started ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1) + ' ';
    started = true; last = v;
  }
  return `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0.85"/>
    <text x="${x0 + 4}" y="${(Y(last) - 6).toFixed(1)}" font-size="10.5" fill="var(--accent)">EMA20 ${last.toFixed(1)}</text>`;
}

function levelSvg() {
  if (!S.layers.sr || !DATA.levels.length) return '';
  const hot = id => {
    if (S.hoverLevel === id || S.lockLevel === id) return 'active';
    if (S.focus && S.focus.length) {
      // focus 里的 id 全部失效时不要把所有线都压暗 —— 退化成不过滤
      if (!S.focus.some(f => DATA.levels.some(l => l.id === f))) return 'idle';
      return S.focus.includes(id) ? 'hot' : 'cold';
    }
    return 'idle';
  };
  let out = '', labels = [];
  for (const l of DATA.levels) {
    const st = hot(l.id);
    const y = Y(l.price);
    const col = l.side === 'res' ? 'var(--bad)' : 'var(--ok)';
    const op = st === 'cold' ? 0.15 : (st === 'idle' ? 0.6 : 1);
    const wd = st === 'active' ? 1.9 : (st === 'hot' ? 1.5 : 1);
    if (st === 'active' || st === 'hot') {
      out += `<rect x="${x0}" y="${(y - 5).toFixed(1)}" width="${x1 - x0}" height="10" fill="${col}" opacity="0.08"/>`;
    }
    out += `<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="${col}"
      stroke-width="${wd}" stroke-dasharray="${l.side === 'res' ? '5 3' : '3 3'}" opacity="${op}"/>`;
    out += `<rect x="${x1 + 3}" y="${(y - 7).toFixed(1)}" width="78" height="14" rx="3"
      fill="${st === 'active' ? col : 'var(--panel)'}" opacity="${st === 'cold' ? 0.3 : 1}"/>`;
    out += `<text x="${x1 + 8}" y="${y.toFixed(1)}" font-size="10.5" font-family="var(--mono)" dominant-baseline="middle"
      fill="${st === 'active' ? '#fff' : col}" opacity="${st === 'cold' ? 0.4 : 1}">${fmt(l.price)}</text>`;
    labels.push({ l, y, st, col });
  }
  for (const it of labels) {
    if (it.st === 'cold') continue;
    const op = it.st === 'idle' ? 0.7 : 1;
    // 顶部会被阶段标题条压住 —— 名字改挂到线的右端
    const near = it.y - 5 < y0 + 48;
    const lx = near ? x1 - 6 : x0 + 6;
    out += `<text x="${lx.toFixed(1)}" y="${(it.y - 5).toFixed(1)}" font-size="10.5" fill="${it.col}" opacity="${op}"
      ${near ? 'text-anchor="end"' : ''} stroke="var(--panel)" stroke-width="3" paint-order="stroke">${esc(it.l.short || it.l.name)}</text>`;
  }
  return out;
}

function mmSvg() {
  if (!S.layers.mm) return '';
  // 情景推演时目标位标签会与测量位抢位置 —— 此时只留线，文案由情景卡承担
  const withText = !S.scenario;
  let out = '';
  for (const m of DATA.mm) {
    const y = Y(m.price);
    out += `<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="var(--warn)"
      stroke-width="1.2" stroke-dasharray="2 4" opacity="0.9"/>`;
    if (withText) {
      out += `<text x="${x1 - 4}" y="${(y - 5).toFixed(1)}" font-size="10.5" fill="var(--warn)" text-anchor="end"
        stroke="var(--panel)" stroke-width="3" paint-order="stroke">${esc(m.name)} ${fmt(m.price)} · ${esc(m.why)}</text>`;
    }
  }
  return out;
}

function gapSvg() {
  if (!S.layers.gap || !DATA.bearBar) return '';
  const bb = DATA.bearBar;
  const top = Y(Math.max(bb.o, bb.c)), bot = Y(Math.min(bb.o, bb.c));
  let out = '';
  out += `<rect x="${x0}" y="${top.toFixed(1)}" width="${x1 - x0}" height="${(bot - top).toFixed(1)}"
    fill="var(--warn)" opacity="0.10"/>`;
  out += `<line x1="${x0}" y1="${top.toFixed(1)}" x2="${x1}" y2="${top.toFixed(1)}" stroke="var(--warn)"
    stroke-width="1" stroke-dasharray="1 3" opacity="0.8"/>`;
  const cx = X(bb.i);
  out += `<rect x="${(cx - step / 2 - 1.5).toFixed(1)}" y="${(Y(bb.h) - 3).toFixed(1)}" width="${(step + 3).toFixed(1)}"
    height="${(Y(bb.l) - Y(bb.h) + 6).toFixed(1)}" fill="none" stroke="var(--warn)" stroke-width="1.2" rx="2"/>`;
  out += `<text x="${(cx + 6).toFixed(1)}" y="${(Y(bb.h) - 7).toFixed(1)}" font-size="10.5" fill="var(--warn)"
    stroke="var(--panel)" stroke-width="3" paint-order="stroke">${esc(bb.t)} 大阴线（${bb.range} 点）· 实体 ${fmt(bb.c)}–${fmt(bb.o)}</text>`;
  const g = (DATA.gaps.unfilled || [])[0];
  if (g) {
    const gy = Y(g.lo);
    out += `<circle cx="${cx.toFixed(1)}" cy="${gy.toFixed(1)}" r="4" fill="none" stroke="var(--warn)" stroke-width="1.6"/>`;
    out += `<text x="${(cx + 10).toFixed(1)}" y="${(Y(Math.min(bb.o, bb.c)) + 14).toFixed(1)}" font-size="10.5" fill="var(--warn)"
      stroke="var(--panel)" stroke-width="3" paint-order="stroke">唯一未回补缺口 ${fmt(g.lo)}–${fmt(g.hi)}（宽 ${g.size} 点 ≈ 1 tick）</text>`;
  }
  return out;
}

function scenarioSvg() {
  const s = DATA.scenarios.find(z => z.id === S.scenario);
  if (!s || !s.targets.length) return '';
  const bx = x0 + (x1 - x0) * 0.62;
  const isShort = s.dir === 'short';
  const t1 = s.targets[0], t2 = s.targets[1] || s.targets[0];
  const yE = Y(s.entry), yS = Y(s.stop), yT1 = Y(t1.p), yT2 = Y(t2.p);
  let out = `<rect x="${bx.toFixed(1)}" y="${y0}" width="${(x1 - bx).toFixed(1)}" height="${y1 - y0}"
    fill="var(--accent)" opacity="0.035"/>`;
  out += `<line x1="${bx.toFixed(1)}" y1="${y0}" x2="${bx.toFixed(1)}" y2="${y1}" stroke="var(--accent)"
    stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>`;
  out += `<rect x="${bx.toFixed(1)}" y="${Math.min(yE, yS).toFixed(1)}" width="${(x1 - bx).toFixed(1)}"
    height="${Math.abs(yS - yE).toFixed(1)}" fill="var(--bad)" opacity="0.18"/>`;
  out += `<rect x="${bx.toFixed(1)}" y="${Math.min(yE, yT1).toFixed(1)}" width="${(x1 - bx).toFixed(1)}"
    height="${Math.abs(yT1 - yE).toFixed(1)}" fill="var(--ok)" opacity="0.16"/>`;
  out += `<rect x="${bx.toFixed(1)}" y="${Math.min(yT1, yT2).toFixed(1)}" width="${(x1 - bx).toFixed(1)}"
    height="${Math.abs(yT2 - yT1).toFixed(1)}" fill="var(--ok)" opacity="0.08"/>`;
  const lnAt = (p, col, dash) =>
    `<line x1="${x0}" y1="${Y(p).toFixed(1)}" x2="${x1}" y2="${Y(p).toFixed(1)}" stroke="${col}" stroke-width="1.6" stroke-dasharray="${dash}"/>`;
  out += lnAt(s.stop, 'var(--bad)', '6 3') + lnAt(s.entry, 'var(--accent)', '6 3')
       + lnAt(t1.p, 'var(--ok)', '6 3') + lnAt(t2.p, 'var(--ok)', '2 3');
  // 入场 / 止损 可能只差几个点，标签必须分列线的两侧才不会叠字
  const entryAbove = s.entry > s.stop;
  const lab = (y, col, text) =>
    `<text x="${(bx + 8).toFixed(1)}" y="${y.toFixed(1)}" font-size="10.5" font-weight="500" fill="${col}"
      stroke="var(--panel)" stroke-width="3.5" paint-order="stroke">${esc(text)}</text>`;
  out += lab(entryAbove ? yS + 14 : yS - 6, 'var(--bad)', `止损 ${fmt(s.stop)}`);
  out += lab(entryAbove ? yE - 6 : yE + 14, 'var(--accent)', `入场 ${fmt(s.entry)}（风险 ${s.risk} 点）`);
  out += lab(yT1 - 6, 'var(--ok)', `目标1 ${fmt(t1.p)} · ${t1.label} · RR ${t1.rr}`);
  if (s.targets[1]) out += lab(yT2 - 6, 'var(--ok)', `目标2 ${fmt(t2.p)} · ${t2.label} · RR ${t2.rr}`);
  const ax = bx + 26;
  out += isShort
    ? `<line x1="${ax.toFixed(1)}" y1="${(yE + 8).toFixed(1)}" x2="${ax.toFixed(1)}" y2="${(yT2 - 8).toFixed(1)}" stroke="var(--bad)" stroke-width="2" marker-end="url(#ar)"/>`
    : `<line x1="${ax.toFixed(1)}" y1="${(yE - 8).toFixed(1)}" x2="${ax.toFixed(1)}" y2="${(yT2 + 8).toFixed(1)}" stroke="var(--ok)" stroke-width="2" marker-end="url(#ar)"/>`;
  const cy2 = y1 - 38;
  out += `<rect x="${(bx + 6).toFixed(1)}" y="${cy2.toFixed(1)}" width="72" height="17" rx="4" fill="var(--accent)" opacity="0.92"/>`
       + `<text x="${(bx + 42).toFixed(1)}" y="${(cy2 + 12).toFixed(1)}" font-size="11" fill="#fff" text-anchor="middle">情景 ${s.id} 推演</text>`;
  out += `<text x="${(bx + (x1 - bx) / 2).toFixed(1)}" y="${(y1 - 6).toFixed(1)}" font-size="10.5" text-anchor="middle"
    fill="var(--muted)">风险 ${s.risk} 点 ｜ 目标1 收益 ${Math.abs(t1.p - s.entry).toFixed(1)} 点（RR ${t1.rr}）｜ 目标2 RR ${t2.rr}</text>`;
  return out;
}

function render() {
  const svg = document.getElementById('chart');
  svg.innerHTML = `
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <clipPath id="clip"><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}"/></clipPath>
    </defs>
    ${phaseBands()}
    <g clip-path="url(#clip)">${gridSvg()}${emaSvg()}${candleSvg()}</g>
    ${levelSvg()}
    ${mmSvg()}
    ${gapSvg()}
    ${scenarioSvg()}
    <line id="cross" x1="0" y1="${y0}" x2="0" y2="${y1}" stroke="var(--ink)" stroke-width="0.8"
      stroke-dasharray="3 3" opacity="0"/>
    <rect id="hit" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="transparent" style="cursor:crosshair"/>`;
  bindChart();
  if (S.hoverBar != null) moveCross(S.hoverBar);
}

/* ---------------------------------------------------------- 悬停 */
function moveCross(i) {
  const b = DATA.bars[i];
  const c = document.getElementById('cross');
  if (c) { c.setAttribute('x1', X(i).toFixed(1)); c.setAttribute('x2', X(i).toFixed(1)); c.setAttribute('opacity', '0.55'); }
  const up = b.c >= b.o, chg = b.c - b.o;
  const tip = document.getElementById('tip');
  tip.innerHTML = `<div class="hd">${esc(b.ts)} <span style="opacity:.6">#${i + 1}</span></div>
    <div class="r">开 <span class="${up?'up':'dn'}">${b.o.toFixed(2)}</span>　高 ${b.h.toFixed(2)}　低 ${b.l.toFixed(2)}</div>
    <div class="r">收 <span class="${up?'up':'dn'}">${b.c.toFixed(2)}</span>　幅 ${chg >= 0 ? '+' : ''}${chg.toFixed(2)}　区间 ${(b.h - b.l).toFixed(2)}</div>`;
  tip.style.opacity = 1;
  const box = document.querySelector('.chartcard').getBoundingClientRect();
  const scale = box.width / W;
  const px = box.left + X(i) * scale;
  tip.style.left = Math.max(box.left + 8, Math.min(px + 14, box.right - tip.offsetWidth - 8)) - box.left + 'px';
  tip.style.top = Math.max(8, box.top + Y(b.h) * scale - tip.offsetHeight - 14) - box.top + 'px';
}

function bindChart() {
  const hit = document.getElementById('hit');
  if (!hit) return;
  hit.addEventListener('mousemove', e => {
    const r = hit.ownerSVGElement.getBoundingClientRect();
    let i = Math.floor(((e.clientX - r.left) / r.width * W - x0) / step);
    i = Math.max(0, Math.min(N - 1, i));
    S.hoverBar = i;
    moveCross(i);
  });
  hit.addEventListener('mouseleave', () => {
    S.hoverBar = null;
    document.getElementById('tip').style.opacity = 0;
    const c = document.getElementById('cross');
    if (c) c.setAttribute('opacity', '0');
  });
}

/* ---------------------------------------------------------- 顶部 / 指标 */
function renderHead() {
  const m = DATA.meta, s = DATA.stats, c = DATA.conclusion;
  document.title = DATA.title;
  document.getElementById('hTitle').textContent = DATA.title;
  document.getElementById('hSub').textContent =
    `${m.name || ''} · ${m.venue || ''} · ${s.openT} – ${s.closeT}（${s.tz}）· ${s.n} 根 ${m.interval} K 线 · 数据源：${m.source || '—'}`;
  document.getElementById('vLabel').textContent = c.label;
  document.getElementById('vConf').textContent = c.conf;
  document.getElementById('vPx').innerHTML = `${c.price.toFixed(1)}<small>${esc(c.stance)}</small>`;

  const r = DATA.ranges || {}, ttr = r.ttr, leg = r.leg, win = r.win;
  const cards = [
    ['开盘', s.open.toFixed(1), s.openT, ''],
    ['最高', s.high.toFixed(1), s.highT, 'up'],
    ['最低', s.low.toFixed(1), s.lowT, 'dn'],
    ['收盘', s.close.toFixed(1), s.closeT, ''],
    ['日涨跌', (s.change >= 0 ? '+' : '') + s.change.toFixed(1), s.changePct + '%', s.change >= 0 ? 'up' : 'dn'],
    ['ATR14', Number(DATA.atr).toFixed(2), '近期波动基准', ''],
    ['主区间', leg ? leg.lo.toFixed(1) + '–' + leg.hi.toFixed(1) : '—', leg ? '高 ' + leg.height.toFixed(1) + ' 点' : '', ''],
    [ttr ? '窄幅区间' : '窗口区间', ttr ? ttr.lo.toFixed(1) + '–' + ttr.hi.toFixed(1) : (win ? win.lo.toFixed(1) + '–' + win.hi.toFixed(1) : '—'),
     ttr ? `宽 ${ttr.height.toFixed(1)} 点 · ${ttr.bars} 根` : '', ''],
  ];
  document.getElementById('metrics').innerHTML = cards.map(([k, v, x, cls]) =>
    `<div class="m"><div class="k">${k}</div><div class="v ${cls}">${esc(v)}</div><div class="x">${esc(x)}</div></div>`).join('');
}

/* ---------------------------------------------------------- 控件 */
function renderControls() {
  document.getElementById('phaseChips').innerHTML =
    [['all', '全部'], ...DATA.phases.map(p => [p.id, p.label.replace(/^[①②③④⑤⑥⑦⑧⑨]\s*/, '')])]
      .map(([id, lb]) => `<span class="chip ${S.phase === id ? 'on' : ''}" data-phase="${id}">${esc(lb)}</span>`).join(' ');
  document.querySelectorAll('[data-phase]').forEach(el => el.onclick = () => {
    const v = el.dataset.phase;
    S.phase = (v === 'all') ? 'all' : Number(v);
    writeHash(); renderControls(); render();
  });

  const layers = [['phase', '阶段分区'], ['gap', '缺口 / 大阴线'], ['sr', '支撑阻力'], ['mm', '测量目标'], ['ema', 'EMA20']];
  document.getElementById('layerTogs').innerHTML = layers.map(([k, lb]) =>
    `<label class="tog ${S.layers[k] ? '' : 'off'}"><input type="checkbox" data-layer="${k}" ${S.layers[k] ? 'checked' : ''}>${lb}</label>`).join('');
  document.querySelectorAll('[data-layer]').forEach(el => el.onchange = () => {
    S.layers[el.dataset.layer] = el.checked;
    renderControls(); render();
  });
}

/* ---------------------------------------------------------- 六步卡 */
function renderSteps() {
  const box = document.getElementById('steps');
  if (!DATA.steps.length) { box.innerHTML = '<div class="empty">本次未给出分步结论（facts-only 模式）。</div>'; return; }
  box.innerHTML = DATA.steps.map(st => `
    <div class="step ${S.focus && S.focus.length && (st.focus || []).length && S.focus.join() === st.focus.join() ? 'on' : ''}" data-step="${st.n}">
      <div class="sh">
        <div class="idx">${st.n}</div>
        <div class="ttl">${esc(st.title)}</div>
        <span class="tag ${st.tone || 'warn'}">${esc(st.verdict || '')}</span>
        ${(st.focus || []).length ? '<span class="go">高亮 ›</span>' : ''}
      </div>
      <ul>${(st.points || []).map(p => `<li>${md(p)}</li>`).join('')}</ul>
    </div>`).join('');
  document.querySelectorAll('[data-step]').forEach(el => el.onclick = () => {
    const st = DATA.steps.find(x => x.n === Number(el.dataset.step));
    if (!st || !(st.focus || []).length) return;
    S.focus = (S.focus && S.focus.join() === st.focus.join()) ? null : st.focus.slice();
    if (S.focus) S.layers.sr = true;
    renderControls(); renderSteps(); render();
  });
}

/* ---------------------------------------------------------- 关键位 */
function renderLevels() {
  const box = document.getElementById('levels');
  if (!DATA.levels.length) { box.innerHTML = '<tbody><tr><td class="empty">本次未给出关键位。</td></tr></tbody>'; return; }
  const rows = DATA.levels.map(l => {
    const on = S.lockLevel === l.id || S.hoverLevel === l.id;
    const n = (l.reasons || []).length;
    return `<tr class="lv ${on ? 'on' : ''}" data-lv="${l.id}">
      <td class="p ${l.side}">${fmt(l.price)}</td>
      <td class="nm">${esc(l.name)}</td>
      <td><span class="mask">${[0,1,2,3,4].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>
        <span style="font-size:11px;color:var(--faint);margin-left:5px">${n}</span></td>
    </tr>
    <tr data-sub="${l.id}" style="display:${on ? '' : 'none'}"><td colspan="3" style="padding:0 8px 9px">
      <div class="rl">${(l.reasons || []).map(r => '· <b>' + esc(r) + '</b>').join('<br>')}</div></td></tr>`;
  }).join('');
  box.innerHTML = `<thead><tr><th style="width:78px">价位</th><th>名称</th><th style="width:72px">理由数</th></tr></thead><tbody>${rows}</tbody>`;
  document.querySelectorAll('[data-lv]').forEach(el => {
    const id = el.dataset.lv;
    el.onmouseenter = () => { S.hoverLevel = id; renderLevels(); render(); };
    el.onmouseleave = () => { S.hoverLevel = null; renderLevels(); render(); };
    el.onclick = () => { S.lockLevel = S.lockLevel === id ? null : id; writeHash(); renderLevels(); render(); };
  });
}

/* ---------------------------------------------------------- 情景 */
function renderScenarios() {
  const box = document.getElementById('scenarios');
  if (!DATA.scenarios.length) { box.innerHTML = '<div class="empty">本次未给出可执行方案。</div>'; return; }
  box.innerHTML = DATA.scenarios.map(s => {
    const on = S.scenario === s.id;
    const t1 = s.targets[0], t2 = s.targets[1];
    const mx = 14;
    return `<div class="sc s-${s.dir} ${on ? 'on' : ''}" data-sc="${s.id}">
      <div class="hd">
        <div class="badge">${s.id}</div>
        <div class="nm2">${esc(s.name)}</div>
        <span class="dirtag">${s.dir === 'short' ? '做空' : '做多'}</span>
      </div>
      <div class="when">${esc(s.when)}</div>
      <div class="rows">
        <div class="row e"><span>入场</span><span class="v">${fmt(s.entry)}</span></div>
        <div class="row s"><span>止损</span><span class="v">${fmt(s.stop)}（风险 ${s.risk} 点）</span></div>
        <div class="row t"><span>目标1</span><span class="v">${fmt(t1.p)}　RR ${t1.rr}</span></div>
        ${t2 ? `<div class="row t"><span>目标2</span><span class="v">${fmt(t2.p)}　RR ${t2.rr}</span></div>` : ''}
      </div>
      <div style="margin-top:9px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:3px">
          <span>盈亏比</span><span>目标1 ${t1.rr}${t2 ? ' ｜ 目标2 ' + t2.rr : ''}</span></div>
        <div style="height:7px;background:var(--panel3);border-radius:4px;overflow:hidden">
          <div style="height:100%;background:var(--ok);border-radius:4px;width:${Math.min(100, t1.rr / mx * 100)}%"></div></div>
        ${t2 ? `<div style="height:7px;background:var(--panel3);border-radius:4px;overflow:hidden;margin-top:4px">
          <div style="height:100%;background:var(--ok);opacity:.5;border-radius:4px;width:${Math.min(100, t2.rr / mx * 100)}%"></div></div>` : ''}
      </div>
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
      ${(s.reasons || []).length ? `<div class="note" style="background:transparent;border:1px dashed var(--line2);padding:6px 9px">
        叠加理由：${s.reasons.map(esc).join(' · ')}</div>` : ''}
    </div>`;
  }).join('');
  document.querySelectorAll('[data-sc]').forEach(el => el.onclick = () => {
    S.scenario = S.scenario === el.dataset.sc ? null : el.dataset.sc;
    writeHash(); renderScenarios(); render();
  });
}

/* ---------------------------------------------------------- 证据 */
function renderEvidence() {
  const box = document.getElementById('evid');
  if (!DATA.evidence.length) { box.innerHTML = '<div class="empty">本次未给出证据核对表。</div>'; return; }
  box.innerHTML = DATA.evidence.map(e => `
    <div class="ev">
      <div class="eh"><span class="ek">${esc(e.k)}</span><span class="tag ${e.tone || 'warn'}">${esc(e.verdict || '')}</span></div>
      <div class="et">${esc(e.text)}</div>
    </div>`).join('');
}

/* ---------------------------------------------------------- 事实面板 */
function renderFacts() {
  const r = DATA.ranges || {}, mt = DATA.metrics || {}, g = DATA.gaps;
  const cards = [];
  const push = (k, v, x) => cards.push([k, v, x || '']);
  if (r.win) push('窗口极值', `${r.win.lo.toFixed(1)} – ${r.win.hi.toFixed(1)}`, `高 ${r.win.height.toFixed(1)} 点`);
  if (r.leg) push('主区间', `${r.leg.lo.toFixed(1)} – ${r.leg.hi.toFixed(1)}`, `高 ${r.leg.height.toFixed(1)} 点`);
  if (r.ttr) push('窄幅区间', `${r.ttr.lo.toFixed(1)} – ${r.ttr.hi.toFixed(1)}`, `高 ${r.ttr.height.toFixed(1)} · ${r.ttr.bars} 根`);
  if (mt.downLeg) push('空头腿', `−${mt.downLeg.points.toFixed(1)} 点`, `${mt.downLeg.bars} 根`);
  if (mt.rebound) push('反弹腿', `+${mt.rebound.points.toFixed(1)} 点`, `${mt.rebound.bars} 根 · 回撤 ${mt.rebound.retracePct}%`);
  push('缺口（价格 / 实体）', `${g.nPrice} / ${g.nBody}`, `未回补 ${g.unfilled.length} · 噪声 ${g.noise}`);
  document.getElementById('facts').innerHTML = cards.map(([k, v, x]) =>
    `<div class="fg"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="x">${esc(x)}</div></div>`).join('');

  document.getElementById('notes').innerHTML = (DATA.notes || []).map(n => `<div>${esc(n)}</div>`).join('');

  const cand = DATA.levelCandidates || [];
  document.getElementById('candSum').textContent =
    `关键位候选（脚本按 0.75×ATR 聚类 · ${cand.length} 档）`;
  document.getElementById('cand').innerHTML = cand.length ? `<table><tbody>` + cand.map(c => `
    <tr><td class="p ${c.side}" style="width:70px">${c.price.toFixed(2)}</td>
      <td style="width:38px;color:var(--faint)">${c.side === 'res' ? '阻力' : '支撑'}</td>
      <td style="width:34px;font-family:var(--mono)">${c.n}×</td>
      <td class="cd">${c.reasons.map(esc).join(' · ')}</td></tr>`).join('') + `</tbody></table>` : '';
}

/* ---------------------------------------------------------- 缺口 */
function renderGaps() {
  const g = DATA.gaps;
  document.getElementById('gCount').innerHTML =
    `口径同 <code>market_digest.py</code>：实体 / 引线不重叠且 ≥ ${g.tick} tick —— 共 <b>${g.total}</b> 个（价格 ${g.nPrice} · 实体 ${g.nBody}）`;
  document.getElementById('gSum').innerHTML = [
    ['缺口总数', g.total, ''], ['已回补', g.filled, ''],
    ['未回补', g.unfilled.length, 'bad'], ['1 tick 级噪声', g.noise, ''],
  ].map(([k, v, c]) => `<div class="s"><div class="k">${k}</div><div class="v" style="${c === 'bad' ? 'color:var(--warn)' : ''}">${v}</div></div>`).join('');

  const filters = [['all', '全部'], ['open', '仅未回补'], ['real', '仅非噪声（≥0.3 点）'], ['price', '仅价格缺口']];
  document.getElementById('gFilter').innerHTML = '<span class="glab" style="font-size:11.5px;color:var(--faint)">筛选</span>' +
    filters.map(([k, lb]) => `<span class="chip ${S.gapFilter === k ? 'on' : ''}" data-gf="${k}">${lb}</span>`).join('');
  document.querySelectorAll('[data-gf]').forEach(el => el.onclick = () => { S.gapFilter = el.dataset.gf; renderGaps(); });

  let items = g.items;
  if (S.gapFilter === 'open') items = items.filter(x => !x.filled);
  if (S.gapFilter === 'real') items = items.filter(x => !x.noise);
  if (S.gapFilter === 'price') items = items.filter(x => x.kind === 'price');
  const rows = items.map(x => `<tr>
    <td class="mono">${esc(x.t)}</td>
    <td>${x.kind === 'price' ? '<span style="color:var(--accent)">价格</span>' : '实体'}</td>
    <td>${x.dir === 'up' ? '<span style="color:var(--up)">向上</span>' : '<span style="color:var(--dn)">向下</span>'}</td>
    <td class="mono">${x.lo.toFixed(2)} – ${x.hi.toFixed(2)}</td>
    <td class="mono">${x.size.toFixed(2)}${x.noise ? ' <span class="badge2 noise">噪声</span>' : ''}</td>
    <td>${x.filled
      ? `<span class="badge2 done">已回补</span> <span style="font-size:11px;color:var(--faint)">@${esc(x.fillT)}（第 ${x.fillIn} 根）</span>`
      : '<span class="badge2 open">仍敞开</span>'}</td>
  </tr>`).join('');
  document.getElementById('gaps').innerHTML =
    `<thead><tr><th style="width:90px">时间</th><th style="width:70px">类型</th><th style="width:70px">方向</th><th style="width:170px">区间</th><th style="width:130px">宽度</th><th>状态</th></tr></thead>
     <tbody>${rows || '<tr><td colspan="6" class="empty">无匹配记录</td></tr>'}</tbody>`;
}

function renderFoot() {
  const src = DATA.source || {};
  document.getElementById('foot').innerHTML =
    `本页由 <code>zpa-interactive-report</code> 技能生成：事实层 <code>${esc(src.facts || '')}</code>（<code>market_facts.py</code> 现算）+ 结论层 <code>${esc(src.analysis || '（未提供）')}</code>（按「Z说交易」体系填写），渲染于 ${esc(src.generatedAt || '')}。<br>
     图中全部 OHLC、缺口、EMA20、ATR14、波段点、区间与测量位均由脚本从 zpa.market.v1 载荷算出，未手工录入；价格精度对齐 <code>meta.price.tickSize = ${DATA.meta.tickSize}</code>。<br>
     结论为按价格行为体系的分析推演，<b>不构成投资建议</b>。`;
}

/* ---------------------------------------------------------- 深链接（#sc=A&ph=2&lv=r1） */
function readHash() {
  const h = location.hash.replace(/^#/, '');
  if (!h) return;
  for (const kv of h.split('&')) {
    const i = kv.indexOf('='); if (i < 0) continue;
    const k = kv.slice(0, i), v = kv.slice(i + 1);
    if (k === 'sc' && DATA.scenarios.some(s => s.id === v)) S.scenario = v;
    if (k === 'ph' && DATA.phases.some(p => String(p.id) === v)) S.phase = Number(v);
    if (k === 'lv' && DATA.levels.some(l => l.id === v)) S.lockLevel = v;
  }
}
function writeHash() {
  const p = [];
  if (S.scenario) p.push('sc=' + S.scenario);
  if (S.phase !== 'all') p.push('ph=' + S.phase);
  if (S.lockLevel) p.push('lv=' + S.lockLevel);
  history.replaceState(null, '', p.length ? '#' + p.join('&') : location.pathname + location.search);
}

/* ---------------------------------------------------------- 启动 */
readHash();
renderHead(); renderControls(); renderSteps(); renderScenarios(); renderLevels();
renderEvidence(); renderFacts(); renderGaps(); renderFoot(); render();
window.addEventListener('resize', () => { if (S.hoverBar != null) moveCross(S.hoverBar); });
</script>
</body>
